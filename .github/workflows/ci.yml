name: Python control plane
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync ruff check packages tests/unit
      - run: uv run --no-sync ruff format --check packages tests/unit
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q
