[project]
name = "vg-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "vg-core",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pycryptodome>=3.23",
    "websockets>=15",
    "ldap3>=2.9.1,<3",
    "asyncssh>=2.24,<3",
]
[project.scripts]
vg-api = "vg_api.main:run"
[tool.uv.sources]
vg-core = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
